name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: cp .env.ci .env

      - name: Build and start services
        run: docker compose up -d --build --wait

      - name: Lint (ruff)
        run: docker compose exec -T web ruff check --no-cache .

      - name: Tests (pytest)
        run: docker compose exec -T web pytest -v -p no:cacheprovider

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v