name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: cp .env.ci .env

      - name: Build and start services
        run: docker compose up -d --build --wait

      - name: Lint (ruff)
        run: docker compose exec -T web ruff check --no-cache .

      - name: Tests (pytest)
        run: docker compose exec -T web pytest -v -p no:cacheprovider

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build
